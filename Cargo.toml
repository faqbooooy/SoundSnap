[package]
name = "sound-switch"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "SoundSnap"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus",
    "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com",
    "Win32_System_Environment", "Win32_System_IO", "Win32_System_LibraryLoader",
    "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
